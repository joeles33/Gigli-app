I76536<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gigli</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px 100px}
h1{font-size:27px;font-weight:800;letter-spacing:-.6px;margin:0 0 6px}
h2{font-size:20px;font-weight:700;margin:0 0 14px;letter-spacing:-.3px}
.sub{color:#6b6b6b;font-size:15px;line-height:1.45;margin:0 0 22px}
.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.06);margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:6px}
input,textarea{width:100%;padding:15px;font-size:16px;border:1px solid #ddd;border-radius:14px;margin-bottom:14px;background:#fafafa;font-family:inherit;color:#111}
input:focus,textarea:focus{outline:none;border-color:#E11D2E;background:#fff}
.btn{width:100%;padding:17px;font-size:17px;font-weight:700;border:none;border-radius:16px;background:#E11D2E;color:#fff;margin-bottom:10px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:#111;border:1px solid #ddd}
.btn.small{width:auto;padding:11px 18px;font-size:14px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:#fff;border:1px solid #eee;border-radius:18px;padding:20px 10px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.05);transition:transform .1s}
.cat:active{transform:scale(.96);border-color:#E11D2E}
.cat .e{font-size:29px;display:block;margin-bottom:7px}
.cat .n{font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{padding:11px 15px;border:1px solid #ddd;border-radius:999px;font-size:14px;background:#fff;color:#111}
.chip.on{background:#E11D2E;color:#fff;border-color:#E11D2E}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.back{font-size:24px;color:#E11D2E;background:none;border:none;padding:4px 6px 4px 0;line-height:1}
.err{background:#fff2f3;color:#c0102a;padding:13px;border-radius:13px;font-size:14px;margin-bottom:14px;line-height:1.4}
.ok{background:#f1faf3;color:#1a7f3c;padding:13px;border-radius:13px;font-size:14px;margin-bottom:14px;line-height:1.4}
.muted{color:#8a8a8a;font-size:13px;line-height:1.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:#E11D2E;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0}
.msg{max-width:78%;padding:11px 14px;border-radius:17px;margin-bottom:8px;font-size:15px;line-height:1.35;word-wrap:break-word}
.mine{background:#E11D2E;color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.their{background:#f2f2f2;border-bottom-left-radius:5px}
.chatbar{display:flex;gap:8px;position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;border-top:1px solid #eee;max-width:520px;margin:0 auto}
.chatbar input{margin:0}
.chatbar button{background:#E11D2E;color:#fff;border:none;border-radius:14px;padding:0 18px;font-size:19px;font-weight:700}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;max-width:520px;margin:0 auto;padding:8px 0 14px}
.tab{flex:1;background:none;border:none;text-align:center;font-size:11px;color:#999;font-weight:600}
.tab .i{font-size:21px;display:block;margin-bottom:2px}
.tab.on{color:#E11D2E}
.hide{display:none!important}

/* --- Intro: huevo --- */
#splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .6s}
.egg{width:96px;height:124px;background:#fff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 14px 40px rgba(0,0,0,.16),inset -8px -10px 24px rgba(0,0,0,.05);position:relative;animation:wob 1s ease-in-out 2}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.crack{position:absolute;top:52%;left:0;width:100%;height:3px;background:#111;clip-path:polygon(0 40%,12% 0,25% 90%,38% 10%,52% 100%,65% 5%,78% 85%,90% 15%,100% 60%,100% 100%,0 100%);opacity:0;animation:cr .5s ease 2s forwards}
@keyframes cr{to{opacity:1}}
.chick{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:36px;animation:pop .6s cubic-bezier(.2,1.5,.4,1) 2.4s forwards}
@keyframes pop{to{transform:translate(-50%,-80%) scale(1)}}
#splash .brand{margin-top:30px;font-size:34px;font-weight:800;letter-spacing:-1px;opacity:0;animation:fu .7s ease 2.9s forwards}
#splash .tag{color:#8a8a8a;font-size:14px;margin-top:6px;opacity:0;animation:fu .7s ease 3.1s forwards}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>

<div id="splash">
  <div class="egg"><div class="crack"></div><div class="chick">🐣</div></div>
  <div class="brand">Gigli</div>
  <div class="tag">Sal, haz algo, conoce a alguien</div>
</div>

<div id="app" class="wrap hide"></div>
<div id="tabs" class="tabs hide">
  <button class="tab on" data-t="home"><span class="i">🔍</span>Explorar</button>
  <button class="tab" data-t="plans"><span class="i">📍</span>Mis planes</button>
  <button class="tab" data-t="chats"><span class="i">💬</span>Chats</button>
  <button class="tab" data-t="me"><span class="i">👤</span>Perfil</button>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const CATS = [
  {n:'Café',e:'☕'},{n:'Caminar',e:'🚶'},{n:'Gimnasio',e:'🏋️'},{n:'Senderismo',e:'🥾'},
  {n:'Playa',e:'🏖️'},{n:'Deportes',e:'⚽'},{n:'Bailar',e:'💃'},{n:'Comer',e:'🍽️'},
  {n:'Museos',e:'🏛️'},{n:'Parques',e:'🌳'},{n:'Conciertos',e:'🎵'},{n:'Viajes',e:'✈️'},
  {n:'Explorar',e:'🧭'}
];
const SLOTS = ['Ahora','En 1 hora','Esta tarde','Esta noche','Mañana'];

const app = document.getElementById('app');
const tabs = document.getElementById('tabs');
let sb = null, me = null, state = {};

const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini = s => (s||'?').trim().charAt(0).toUpperCase();

function connect(){
  const url = localStorage.getItem('gigli_url');
  const key = localStorage.getItem('gigli_key');
  if(!url || !key) return false;
  try { sb = createClient(url, key); return true; } catch(e){ return false; }
}

/* ---------- Pantallas ---------- */

function screenConfig(msg){
  tabs.classList.add('hide');
  app.innerHTML = `
    <h1>Conectar Gigli</h1>
    <p class="sub">Pega los datos de tu proyecto de Supabase. Solo hay que hacerlo una vez en este dispositivo.</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <div class="card">
      <label>Project URL</label>
      <input id="u" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off">
      <label>Clave anon public</label>
      <input id="k" placeholder="eyJhbGciOi..." autocapitalize="off" autocorrect="off">
      <button class="btn" id="go">Conectar</button>
</div>
    <p class="muted">Los datos se guardan solo en este teléfono.</p>
  `;
  document.getElementById('u').value = localStorage.getItem('gigli_url') || '';
  document.getElementById('k').value = localStorage.getItem('gigli_key') || '';
  document.getElementById('go').onclick = () => {
    const u = document.getElementById('u').value.trim();
    const k = document.getElementById('k').value.trim();
    if(!u.startsWith('http') || k.length < 20) return screenConfig('Revisa la URL y la clave.');
    localStorage.setItem('gigli_url', u);
    localStorage.setItem('gigli_key', k);
    if(connect()) start(); else screenConfig('No se pudo conectar.');
  };
}

function screenAuth(mode, msg){
  tabs.classList.add('hide');
  const reg = mode === 'reg';
  app.innerHTML = `
    <h1>${reg ? 'Crear cuenta' : 'Entrar'}</h1>
    <p class="sub">${reg ? 'Empieza a descubrir planes cerca de ti.' : 'Bienvenido de nuevo a Gigli.'}</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <div class="card">
      ${reg ? '<label>Nombre</label><input id="n" placeholder="Tu nombre" autocapitalize="words">' : ''}
      <label>Correo</label>
      <input id="e" type="email" placeholder="tu@correo.com" autocapitalize="off" autocorrect="off">
      <label>Contraseña</label>
      <input id="p" type="password" placeholder="Mínimo 6 caracteres">
      <button class="btn" id="go">${reg ? 'Crear cuenta' : 'Entrar'}</button>
      <button class="btn ghost" id="sw">${reg ? 'Ya tengo cuenta' : 'Crear una cuenta'}</button>
    </div>
    <p class="muted">Nunca mostramos tu ubicación exacta a otras personas.</p>
  `;
  document.getElementById('sw').onclick = () => screenAuth(reg ? 'in' : 'reg');
  document.getElementById('go').onclick = doAuth;
}
async function doAuth(){
  const reg = !!document.getElementById('n');
  const email = document.getElementById('e').value.trim();
  const pass = document.getElementById('p').value;
  const name = reg ? document.getElementById('n').value.trim() : '';
  if(!email || pass.length < 6) return screenAuth(reg?'reg':'in','Revisa el correo y la contraseña.');
  if(reg && !name) return screenAuth('reg','Escribe tu nombre.');
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = 'Un momento...';
  try {
    if(reg){
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if(error) throw error;
      if(data.user){
        await sb.from('profiles').upsert({ id: data.user.id, full_name: name });
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
    }
    start();
  } catch(err){
    screenAuth(reg?'reg':'in', err.message || 'No se pudo completar.');
  }
}

async function start(){
  const { data } = await sb.auth.getSession();
  if(!data.session) return screenAuth('reg');
  me = data.session.user;
  const { data: p } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  state.profile = p || { id: me.id, full_name: 'Tú' };
  screenHome();
}

async function logout(){
  await sb.auth.signOut();
  me = null;
  screenAuth('in');
}
const MOODS = ['Relajarme','Socializar','Conocer gente','Ejercicio','Explorar','Aburrido','Algo espontáneo'];

function screenHome(){
  tabs.classList.remove('hide');
  setTab('home');
  const nombre = (state.profile.full_name || '').split(' ')[0];
  app.innerHTML = `
    <h1>¿Qué quieres hacer hoy${nombre ? ', ' + esc(nombre) : ''}?</h1>
    <p class="sub">Elige un plan y Gigli busca sitio, hora y gente.</p>
    <div class="chips" id="moods">
      ${MOODS.map(m => `<button class="chip${state.mood===m?' on':''}" data-m="${esc(m)}">${esc(m)}</button>`).join('')}
    </div>
    <h2>Categorías</h2>
    <div class="grid" id="cats">
      ${CATS.map(c => `<button class="cat" data-c="${esc(c.n)}"><span class="e">${c.e}</span><span class="n">${esc(c.n)}</span></button>`).join('')}
    </div>
  `;
  document.querySelectorAll('#moods .chip').forEach(b => {
    b.onclick = () => { state.mood = state.mood === b.dataset.m ? null : b.dataset.m; screenHome(); };
  });
  document.querySelectorAll('#cats .cat').forEach(b => {
    b.onclick = () => screenPlan(b.dataset.c);
  });
}

function setTab(name){
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('on', t.dataset.t === name);
  });
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    const n = t.dataset.t;
    if(n === 'home') screenHome();
    if(n === 'plans') screenPlans();
    if(n === 'chats') screenChats();
    if(n === 'me') screenMe();
  };
});
function screenPlan(cat){
  tabs.classList.add('hide');
  state.cat = cat;
  state.slot = state.slot || SLOTS[0];
  const c = CATS.find(x => x.n === cat) || {e:'📍'};
  app.innerHTML = `
    <div class="top"><button class="back" id="bk">‹</button><h2 style="margin:0">${c.e} ${esc(cat)}</h2></div>
    <p class="sub">¿Cuándo te viene bien?</p>
    <div class="chips" id="slots">
      ${SLOTS.map(s => `<button class="chip${state.slot===s?' on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')}
    </div>
    <h2>¿Dónde?</h2>
    <div class="card">
      <label>Lugar público del encuentro</label>
      <input id="place" placeholder="Ej: Cafetería Central, Plaza Mayor" value="${esc(state.place||'')}">
      <label>Zona o ciudad</label>
      <input id="city" placeholder="Ej: Oviedo" value="${esc(state.city||'')}">
      <label>¿Con cuánta gente?</label>
      <div class="chips" id="size" style="margin-bottom:4px">
        <button class="chip on" data-z="1">1 persona</button>
        <button class="chip" data-z="3">Grupo pequeño</button>
        <button class="chip" data-z="6">Grupo grande</button>
      </div>
    </div>
    <div class="err hide" id="e1"></div>
    <button class="btn" id="save">Buscar personas</button>
    <p class="muted">Solo se comparte el lugar público. Tu dirección nunca se muestra.</p>
  `;
  document.getElementById('bk').onclick = screenHome;
  document.querySelectorAll('#slots .chip').forEach(b => {
    b.onclick = () => { state.slot = b.dataset.s; screenPlan(cat); };
  });
  document.querySelectorAll('#size .chip').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#size .chip').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      state.size = Number(b.dataset.z);
    };
  });
  document.getElementById('save').onclick = savePlan;
}
async function savePlan(){
  const place = document.getElementById('place').value.trim();
  const city = document.getElementById('city').value.trim();
  const err = document.getElementById('e1');
  if(!place || !city){
    err.textContent = 'Escribe el lugar y la ciudad.';
    err.classList.remove('hide');
    return;
  }
  state.place = place; state.city = city;
  const btn = document.getElementById('save');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const { data, error } = await sb.from('activity_requests').insert({
      user_id: me.id,
      category: state.cat,
      place_name: place,
      city: city,
      time_slot: state.slot,
      group_size: state.size || 1,
      mood: state.mood || null,
      status: 'open'
    }).select().single();
    if(error) throw error;
    state.request = data;
    screenWaiting();
  } catch(e){
    err.textContent = e.message || 'No se pudo guardar.';
    err.classList.remove('hide');
    btn.disabled = false; btn.textContent = 'Buscar personas';
  }
}

function screenWaiting(){
  tabs.classList.add('hide');
  const r = state.request;
  app.innerHTML = `
    <div class="top"><button class="back" id="bk">‹</button><h2 style="margin:0">Buscando</h2></div>
    <div class="card">
      <div class="row">
        <div><strong>${esc(r.category)}</strong><br><span class="muted">${esc(r.place_name)} · ${esc(r.time_slot)}</span></div>
        <div class="e" style="font-size:26px">🔎</div>
      </div>
    </div>
    <p class="sub">Te avisamos en cuanto haya alguien compatible. Mientras tanto, mira estas ideas.</p>
    <h2>Mientras esperas</h2>
    <div class="grid" id="alt"></div>
    <button class="btn ghost" id="cancel" style="margin-top:16px">Cancelar este plan</button>
  `;
  document.getElementById('bk').onclick = screenHome;
  const otras = CATS.filter(c => c.n !== r.category).sort(() => Math.random() - .5).slice(0, 4);
  document.getElementById('alt').innerHTML = otras.map(c =>
    `<button class="cat" data-c="${esc(c.n)}"><span class="e">${c.e}</span><span class="n">${esc(c.n)}</span></button>`
  ).join('');
  document.querySelectorAll('#alt .cat').forEach(b => b.onclick = () => screenPlan(b.dataset.c));
  document.getElementById('cancel').onclick = async () => {
    await sb.from('activity_requests').update({ status: 'cancelled' }).eq('id', r.id);
    screenHome();
  };
  findMatch();
}
async function findMatch(){
  const r = state.request;
  try {
    const { data: bl } = await sb.from('blocks').select('blocked_id').eq('user_id', me.id);
    const bloqueados = (bl || []).map(x => x.blocked_id);
    const { data: cand, error } = await sb.from('activity_requests')
      .select('*')
      .eq('category', r.category)
      .eq('city', r.city)
      .eq('time_slot', r.time_slot)
      .eq('status', 'open')
      .neq('user_id', me.id)
      .limit(10);
    if(error) throw error;
    const libre = (cand || []).filter(c => !bloqueados.includes(c.user_id));
    if(!libre.length) return;
    const otro = libre[0];
    const { data: m, error: e2 } = await sb.from('matches').insert({
      request_a: r.id,
      request_b: otro.id,
      user_a: me.id,
      user_b: otro.user_id,
      place_name: r.place_name,
      time_slot: r.time_slot,
      status: 'active'
    }).select().single();
    if(e2) throw e2;
    await sb.from('activity_requests').update({ status: 'matched' }).in('id', [r.id, otro.id]);
    state.match = m;
    screenMatch(m);
  } catch(e){
    console.log('match:', e.message);
  }
}

function screenMatch(m){
  tabs.classList.add('hide');
  app.innerHTML = `
    <div style="text-align:center;padding:30px 0">
      <div style="font-size:56px">🎉</div>
      <h1 style="margin-top:10px">¡Tienes match!</h1>
      <p class="sub">Alguien quiere el mismo plan que tú.</p>
    </div>
    <div class="card">
      <div class="row">
        <div><strong>${esc(m.place_name)}</strong><br><span class="muted">${esc(m.time_slot)}</span></div>
        <div class="avatar">${ini('G')}</div>
      </div>
    </div>
    <button class="btn" id="chat">Abrir chat</button>
    <button class="btn ghost" id="home">Más tarde</button>
    <p class="muted">Quedad siempre en el lugar público acordado.</p>
  `;
  document.getElementById('chat').onclick = () => screenChat(m);
  document.getElementById('home').onclick = screenHome;
}
function screenChat(m){
  tabs.classList.add('hide');
  state.match = m;
  app.innerHTML = `
    <div class="top">
      <button class="back" id="bk">‹</button>
      <div class="avatar">${ini('G')}</div>
      <div style="flex:1"><strong>${esc(m.place_name)}</strong><br><span class="muted">${esc(m.time_slot)}</span></div>
      <button class="btn small ghost" id="mas">···</button>
    </div>
    <div id="msgs" style="padding-bottom:70px"></div>
    <div class="chatbar">
      <input id="txt" placeholder="Escribe un mensaje">
      <button id="send">➤</button>
    </div>
  `;
  document.getElementById('bk').onclick = screenChats;
  document.getElementById('mas').onclick = () => menuSeguridad(m);
  document.getElementById('send').onclick = enviar;
  document.getElementById('txt').onkeydown = e => { if(e.key === 'Enter') enviar(); };
  cargarMensajes(m);
  if(state.canal) sb.removeChannel(state.canal);
  state.canal = sb.channel('chat-' + m.id)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_messages', filter:'match_id=eq.' + m.id },
      p => pintar(p.new))
    .subscribe();
}

async function cargarMensajes(m){
  const { data } = await sb.from('chat_messages').select('*').eq('match_id', m.id).order('created_at');
  document.getElementById('msgs').innerHTML = '';
  (data || []).forEach(pintar);
}

function pintar(msg){
  const box = document.getElementById('msgs');
  if(!box) return;
  const d = document.createElement('div');
  d.className = 'msg ' + (msg.sender_id === me.id ? 'mine' : 'their');
  d.textContent = msg.content;
  box.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
}

async function enviar(){
  const i = document.getElementById('txt');
  const t = i.value.trim();
  if(!t) return;
  i.value = '';
  await sb.from('chat_messages').insert({
    match_id: state.match.id,
    sender_id: me.id,
    content: t
  });
}
async function screenPlans(){
  tabs.classList.remove('hide'); setTab('plans');
  app.innerHTML = `<h1>Mis planes</h1><p class="sub">Cargando...</p>`;
  const { data } = await sb.from('activity_requests').select('*').eq('user_id', me.id).order('created_at', {ascending:false}).limit(20);
  const lista = (data || []);
  app.innerHTML = `
    <h1>Mis planes</h1>
    ${lista.length ? lista.map(r => `
      <div class="card">
        <div class="row">
          <div><strong>${esc(r.category)}</strong><br><span class="muted">${esc(r.place_name)} · ${esc(r.time_slot)}</span></div>
          <span class="muted">${r.status === 'open' ? 'Buscando' : r.status === 'matched' ? 'Con match' : 'Cerrado'}</span>
        </div>
      </div>`).join('') : '<p class="sub">Todavía no tienes planes. Crea uno desde Explorar.</p>'}
  `;
}

async function screenChats(){
  tabs.classList.remove('hide'); setTab('chats');
  app.innerHTML = `<h1>Chats</h1><p class="sub">Cargando...</p>`;
  const { data } = await sb.from('matches').select('*').or(`user_a.eq.${me.id},user_b.eq.${me.id}`).eq('status','active');
  const lista = (data || []);
  app.innerHTML = `
    <h1>Chats</h1>
    ${lista.length ? lista.map(m => `
      <div class="card" data-id="${m.id}" style="cursor:pointer">
        <div class="row">
          <div class="avatar">${ini('G')}</div>
          <div style="flex:1"><strong>${esc(m.place_name)}</strong><br><span class="muted">${esc(m.time_slot)}</span></div>
        </div>
      </div>`).join('') : '<p class="sub">Aún no tienes conversaciones.</p>'}
  `;
  document.querySelectorAll('[data-id]').forEach(c => {
    c.onclick = () => screenChat(lista.find(x => x.id === c.dataset.id));
  });
}

function screenMe(){
  tabs.classList.remove('hide'); setTab('me');
  const p = state.profile;
  app.innerHTML = `
    <h1>Perfil</h1>
    <div class="card">
      <div class="row">
        <div class="avatar">${ini(p.full_name)}</div>
      <div style="flex:1"><strong>${esc(p.full_name || 'Sin nombre')}</strong><br><span class="muted">${esc(me.email)}</span></div>
      </div>
      </div>
        <label>Tu nombre</label>
        <input id="nm" value="${esc(p.full_name || '')}">
        <button class="btn small" id="sv">Guardar</button>
      </div>
      <button class="btn ghost" id="out">Cerrar sesión</button>
      <p class="muted">Gigli nunca comparte tu ubicación exacta con otras personas.</p>
    `;
  document.getElementById('sv').onclick = async () => {
    const n = document.getElementById('nm').value.trim();
    await sb.from('profiles').upsert({ id: me.id, full_name: n });
    state.profile.full_name = n;
    screenMe();
  };
  document.getElementById('out').onclick = logout;
}
function menuSeguridad(m){
  const otro = m.user_a === me.id ? m.user_b : m.user_a;
  const box = document.createElement('div');
  box.className = 'card';
  box.style.cssText = 'position:fixed;bottom:70px;left:12px;right:12px;max-width:496px;margin:0 auto;z-index:50';
  box.innerHTML = `
    <button class="btn ghost" id="rep">Reportar a esta persona</button>
    <button class="btn ghost" id="blo">Bloquear</button>
    <button class="btn ghost" id="cerrar">Cancelar</button>
  `;
  document.body.appendChild(box);
  box.querySelector('#cerrar').onclick = () => box.remove();
  box.querySelector('#rep').onclick = async () => {
    const motivo = prompt('¿Qué ha pasado?');
    if(motivo){
      await sb.from('reports').insert({ reporter_id: me.id, reported_id: otro, reason: motivo });
      alert('Gracias. Lo revisaremos.');
    }
    box.remove();
  };
  box.querySelector('#blo').onclick = async () => {
    await sb.from('blocks').insert({ user_id: me.id, blocked_id: otro });
    await sb.from('matches').update({ status: 'closed' }).eq('id', m.id);
    box.remove();
    screenChats();
  };
                                                             }
setTimeout(() => {
  const s = document.getElementById('splash');
  s.style.opacity = '0';
  setTimeout(() => {
    s.remove();
    app.classList.remove('hide');
    if(connect()) start(); else screenConfig();
  }, 600);
}, 3800);
</script>
